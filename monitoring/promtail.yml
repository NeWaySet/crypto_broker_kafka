server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: litebroker-chat-containers
    static_configs:
      - targets: [localhost]
        labels:
          job: litebroker-chat-containers
          service: litebroker
          __path__: /var/log/litebroker/chat-containers.jsonl

  - job_name: litebroker-sensor-samples
    static_configs:
      - targets: [localhost]
        labels:
          job: litebroker-sensor-samples
          service: litebroker
          __path__: /var/log/litebroker/sensor-samples.jsonl
