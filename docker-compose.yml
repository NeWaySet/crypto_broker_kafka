services:
  cryptobroker-api:
    build:
      context: ./CryptoBrokerWeb
    container_name: cryptobroker-api
    command: ["npm", "run", "api"]
    ports:
      - "5175:5175"
    environment:
      CRYPTOBROKER_API_PORT: "5175"
      CRYPTOBROKER_SECRET: cryptobroker-dev-secret-change-me
    volumes:
      - cryptobroker-data:/app/server/data

  cryptobroker-web:
    build:
      context: ./CryptoBrokerWeb
    container_name: cryptobroker-web
    command: ["npm", "run", "dev"]
    depends_on:
      - cryptobroker-api
    ports:
      - "5174:5174"
    environment:
      VITE_API_TARGET: http://cryptobroker-api:5175

  kafka:
    image: apache/kafka:3.8.0
    container_name: cryptobroker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: cryptobroker-kafka-ui
    depends_on:
      - kafka
    ports:
      - "18089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cryptobroker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  kafka-producer:
    build:
      context: ./KafkaBroker
    container_name: cryptobroker-kafka-producer
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: cryptobroker.messages.crypto
      CRYPTOBROKER_SECRET: cryptobroker-dev-secret-change-me
    command: ["node", "producer.mjs"]

  kafka-consumer:
    build:
      context: ./KafkaBroker
    container_name: cryptobroker-kafka-consumer
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: cryptobroker.messages.crypto
      CRYPTOBROKER_SECRET: cryptobroker-dev-secret-change-me
    command: ["node", "consumer.mjs"]
    volumes:
      - ./KafkaBroker/logs:/app/logs

  noise-generator:
    build:
      context: ./KafkaBroker
    container_name: cryptobroker-kafka-noise
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_NOISE_TOPIC: cryptobroker.noise.raw
      CRYPTOBROKER_SECRET: cryptobroker-dev-secret-change-me
    command: ["node", "noise-generator.mjs"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cryptobroker-prometheus
    depends_on:
      - cryptobroker-api
    ports:
      - "9090:9090"
    volumes:
      - ./CryptoBrokerWeb/monitoring/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cryptobroker-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  cryptobroker-data:
  kafka-data:
  grafana-data:
