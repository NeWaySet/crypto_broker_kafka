services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: litebroker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: litebroker-kafka-ui
    depends_on:
      - kafka
    ports:
      - "18089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: litebroker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  litebroker:
    build:
      context: ./LiteBroker
    container_name: litebroker-app
    depends_on:
      - kafka
    ports:
      - "18091:18090"
    environment:
      LIGHT_CRYPTO_CHAT_PORT: "18090"
      LIGHT_CRYPTO_SECRET: litebroker-dev-secret-change-me
      KAFKA_BROKERS: kafka:9092
      CHAT_TOPIC_PREFIX: litebroker.chat
      SENSOR_TOPIC: litebroker.sensors.random
      SENSOR_INTERVAL_MS: "5000"
    volumes:
      - litebroker-data:/app/data
      - ./LiteBroker/logs:/app/logs

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: litebroker-prometheus
    depends_on:
      - litebroker
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.2.1
    container_name: litebroker-loki
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    image: grafana/promtail:3.2.1
    container_name: litebroker-promtail
    depends_on:
      - loki
      - litebroker
    volumes:
      - ./LiteBroker/logs:/var/log/litebroker:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: ["-config.file=/etc/promtail/config.yml"]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: litebroker-grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  litebroker-data:
  kafka-data:
  grafana-data:
