<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Kafka Messenger</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="messenger">
      <section class="chat">
        <header class="chat-header">
          <div>
            <h1>Secure Kafka Messenger</h1>
            <p>messages.raw -> crypto container -> messages.filtered</p>
          </div>
          <span class="status" id="status">offline</span>
        </header>

        <div class="message-list" id="messages"></div>

        <form class="composer" id="message-form">
          <input class="sender" name="sender" value="student" maxlength="40" aria-label="Отправитель">
          <textarea name="message" rows="2" placeholder="Написать сообщение..." aria-label="Сообщение"></textarea>
          <button type="submit">Отправить</button>
        </form>
      </section>

      <aside class="telemetry">
        <header>
          <h2>Автодатчик</h2>
          <p>Генератор сам отправляет значения в sensors.raw.</p>
        </header>

        <div class="sensor-summary" id="sensor-summary">
          <span>-- °C</span>
          <span>-- %</span>
        </div>

        <div class="sensor-feed" id="sensors"></div>
      </aside>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
