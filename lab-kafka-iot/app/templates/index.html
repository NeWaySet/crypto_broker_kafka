<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Kafka Messenger</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Secure Kafka Messenger</h1>
          <p>Чат и сенсоры проходят через policy-engine, crypto-gateway и filter.</p>
        </div>
        <span class="status" id="status">connecting</span>
      </header>

      <section class="grid">
        <form class="panel" id="message-form">
          <h2>Сообщение</h2>
          <label>
            Отправитель
            <input name="sender" value="student" maxlength="40">
          </label>
          <label>
            Текст
            <textarea name="message" rows="5" placeholder="Введите сообщение"></textarea>
          </label>
          <button type="submit">Отправить в messages.raw</button>
        </form>

        <form class="panel" id="sensor-form">
          <h2>Сенсор</h2>
          <label>
            ID датчика
            <input name="sensor_id" value="sensor_web" maxlength="40">
          </label>
          <div class="split">
            <label>
              Температура
              <input name="temperature" type="number" step="0.1" value="23.4">
            </label>
            <label>
              Влажность
              <input name="humidity" type="number" step="0.1" value="48.2">
            </label>
          </div>
          <button type="submit">Отправить в sensors.raw</button>
        </form>
      </section>

      <section class="grid results">
        <div class="panel">
          <h2>messages.filtered</h2>
          <div class="feed" id="messages"></div>
        </div>
        <div class="panel">
          <h2>sensors.data.filtered</h2>
          <div class="feed" id="sensors"></div>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
