services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sensors.data --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sensors.raw --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sensors.crypto --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sensors.data.filtered --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic messages.raw --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic messages.crypto --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic messages.filtered --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic policy.requests --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic policy.decisions --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  producer:
    build: ./producer
    container_name: kafka-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CHAT_TOPIC: messages.raw
      KAFKA_SENSOR_TOPIC: sensors.raw
    stdin_open: true
    tty: true
    networks:
      - kafka-network
    profiles:
      - manual

  policy-engine:
    build: ./policy-engine
    container_name: policy-engine
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: policy.requests
      KAFKA_OUTPUT_TOPIC: policy.decisions
      KAFKA_GROUP_ID: policy-engine
      POLICY_FILE: /policy/policy.json
    volumes:
      - ./policy:/policy:ro
    networks:
      - kafka-network
    restart: unless-stopped

  crypto-gateway:
    build: ./crypto-gateway
    container_name: crypto-gateway
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      policy-engine:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPICS: messages.raw,sensors.raw
      KAFKA_CHAT_OUTPUT_TOPIC: messages.crypto
      KAFKA_SENSOR_OUTPUT_TOPIC: sensors.crypto
      KAFKA_POLICY_REQUEST_TOPIC: policy.requests
      KAFKA_POLICY_DECISION_TOPIC: policy.decisions
      KAFKA_GROUP_ID: crypto-gateway
      CRYPTO_KEY: 0KzFWuB9s4ms2Y_KzYlu2fRu1jLHCIuZbcTF3jp2FtQ=
    networks:
      - kafka-network
    restart: unless-stopped

  filter:
    build: ./filter
    container_name: kafka-filter
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      crypto-gateway:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPICS: messages.crypto,sensors.crypto
      KAFKA_CHAT_OUTPUT_TOPIC: messages.filtered
      KAFKA_SENSOR_OUTPUT_TOPIC: sensors.data.filtered
      KAFKA_GROUP_ID: sensor-filter
      CRYPTO_KEY: 0KzFWuB9s4ms2Y_KzYlu2fRu1jLHCIuZbcTF3jp2FtQ=
    networks:
      - kafka-network
    restart: unless-stopped

  consumer:
    build: ./consumer
    container_name: kafka-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS: messages.filtered,sensors.data.filtered
      KAFKA_GROUP_ID: secure-viewer
    networks:
      - kafka-network
    restart: unless-stopped

  app:
    build: ./app
    container_name: secure-messenger-app
    ports:
      - "8088:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      crypto-gateway:
        condition: service_started
      filter:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CHAT_INPUT_TOPIC: messages.raw
      KAFKA_SENSOR_INPUT_TOPIC: sensors.raw
      KAFKA_CHAT_OUTPUT_TOPIC: messages.filtered
      KAFKA_SENSOR_OUTPUT_TOPIC: sensors.data.filtered
      KAFKA_GROUP_ID: web-ui
    networks:
      - kafka-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: kafka-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_INSTALL_PLUGINS: hamedkarbasi93-kafka-datasource
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - kafka-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

networks:
  kafka-network:
    driver: bridge

volumes:
  grafana-storage:
